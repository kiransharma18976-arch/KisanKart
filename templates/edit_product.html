
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | KisanKart</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: #f7f2e8;
            color: #18231f;
            min-height: 100vh;
        }

        .navbar {
            height: 75px;
            background: #152a38;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: 800;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #e7a33e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .main {
            max-width: 800px;
            margin: auto;
            padding: 45px 25px;
        }

        .back {
            color: #68736e;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .card {
            background: white;
            margin-top: 25px;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(20, 35, 30, 0.08);
        }

        .small-title {
            color: #b87322;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        h1 {
            font-family: "Playfair Display", serif;
            color: #152a38;
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #747d78;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #152a38;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd9d0;
            border-radius: 10px;
            font-family: "DM Sans", sans-serif;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #e7a33e;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            border: none;
            background: #152a38;
            color: white;
            padding: 14px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
        }

        .save-btn:hover {
            background: #213f51;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #68736e;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .main {
                padding: 30px 18px;
            }

            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

    <nav class="navbar">

        <a href="/farmer-dashboard" class="logo">

            <div class="logo-icon">
                🌾
            </div>

            KisanKart

        </a>

    </nav>


    <main class="main">

        <a href="/my-products" class="back">
            ← Back to My Products
        </a>


        <div class="card">

            <div class="small-title">
                Farmer Marketplace
            </div>

            <h1>
                ✏️ Edit Product
            </h1>

            <p class="subtitle">
                Update your product information below.
            </p>


            <form method="POST">


                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="product_name"
                        value="{{ product.product_name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select name="category" required>

                        <option value="Vegetables"
                            {% if product.category == "Vegetables" %}selected{% endif %}>
                            Vegetables
                        </option>

                        <option value="Fruits"
                            {% if product.category == "Fruits" %}selected{% endif %}>
                            Fruits
                        </option>

                        <option value="Grains"
                            {% if product.category == "Grains" %}selected{% endif %}>
                            Grains
                        </option>

                        <option value="Dairy"
                            {% if product.category == "Dairy" %}selected{% endif %}>
                            Dairy
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        name="price"
                        value="{{ product.price }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Quantity
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        value="{{ product.quantity }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Unit
                    </label>

                    <input
                        type="text"
                        name="unit"
                        value="{{ product.unit }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        name="description"
                        required
                    >{{ product.description }}</textarea>

                </div>


                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        value="{{ product.location or '' }}"
                    >

                </div>


                <button type="submit" class="save-btn">
                    💾 Save Changes
                </button>

            </form>


            <a href="/my-products" class="cancel">
                Cancel
            </a>

        </div>

    </main>

</body>

</html>
